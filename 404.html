<!DOCTYPE html>
<html lang="es-AR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Página no encontrada · BIOS Salud</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/img/favicon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --teal: #2E7373; --bosque: #1B4D45; --tinta: #16302C; --hueso: #FBFCFB; }
    * { box-sizing: border-box }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: Lexend, system-ui, sans-serif; color: #fff; text-align: center;
      background: radial-gradient(120% 140% at 80% 0%, var(--teal) 0%, var(--bosque) 55%, var(--tinta) 100%);
    }
    img { width: 88px; height: 88px }
    h1 { font-size: clamp(28px, 6vw, 44px); margin: 20px 0 12px; font-weight: 600 }
    p { margin: 0 auto 28px; max-width: 34ch; line-height: 1.5; color: rgba(255, 255, 255, .85) }
    a {
      display: inline-block; padding: 14px 26px; border-radius: 999px; background: var(--hueso);
      color: var(--bosque); font-weight: 600; text-decoration: none
    }
    a:focus-visible { outline: 3px solid #D89A4E; outline-offset: 3px }
  </style>
</head>

<body>
  <main>
    <img src="/img/logo-blanco.png" alt="" width="88" height="88">
    <h1>No encontramos esta página</h1>
